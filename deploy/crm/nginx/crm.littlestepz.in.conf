# nginx site for the CRM: /etc/nginx/sites-available/crm.littlestepz.in
#
# TLS certificates come from certbot: certbot certonly --webroot -w /var/www/certbot -d crm.littlestepz.in
# (renewal is automatic; `systemctl list-timers | grep certbot` shows the timer).
#
# Only this file is public. crm-web (3100), crm-api (8100) and crm-postgres (5433)
# all listen on 127.0.0.1 and are never reachable from outside the host.

server {
    listen 80;
    listen [::]:80;
    server_name crm.littlestepz.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.littlestepz.in;

    ssl_certificate     /etc/letsencrypt/live/crm.littlestepz.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.littlestepz.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:CRM_SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # A private back-office: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Import files are up to 5 MB.
    client_max_body_size 6m;

    # Optional: allow only the shop's and owner's IPs.
    # allow 203.0.113.10;
    # deny all;

    # The API directly. X-Forwarded-For is replaced (not appended), so a client
    # can't spoof its IP to the login rate limiter; crm-api runs with TRUST_PROXY_HOPS=1.
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # Approving a large import can take up to two minutes.
        proxy_read_timeout 150s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
